name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Don't include real customer data, account IDs or secrets.
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement ID
      placeholder: FR-SG-1
